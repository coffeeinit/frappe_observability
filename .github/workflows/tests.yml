name: Frappe Observability checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated test dependencies
        run: python -m pip install psutil werkzeug
      - name: Compile Python modules
        run: python -m compileall -q frappe_observability
      - name: Run isolated unit tests
        run: python -m unittest discover -s frappe_observability/tests -v
      - name: Check Desk JavaScript syntax
        run: node --check frappe_observability/observability/page/observability_dashboard/observability_dashboard.js
      - name: Validate app metadata
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          for path in Path("frappe_observability").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          with Path("pyproject.toml").open("rb") as stream:
          tomllib.load(stream)
          print("All DocType and page JSON plus pyproject.toml are valid.")
          PY
      - name: Build app wheel
        run: |
          python -m pip install flit_core
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir /tmp/wheels
